<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Watch Party - Lecteur HLS</title>

    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
        }

        .container {
            width: 95%;
            max-width: 1100px;
            margin: 40px auto;
        }

        h1 {
            margin-bottom: 20px;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        #url {
            flex: 1;
            padding: 14px;
            border-radius: 8px;
            border: 1px solid #444;
            background: #222;
            color: white;
            font-size: 14px;
        }

        button {
            padding: 14px 22px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        #status {
            margin-bottom: 15px;
            color: #aaa;
        }

        #video {
            width: 100%;
            background: black;
            border-radius: 8px;
            display: block;
        }

        @media (max-width: 700px) {
            .controls {
                flex-direction: column;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🎬 Watch Party</h1>

    <div class="controls">

        <input
            id="url"
            type="text"
            placeholder="Colle ton lien M3U8 ici"
        >

        <button onclick="playVideo()">
            ▶ Lire
        </button>

    </div>

    <div id="status">
        En attente d'une URL M3U8...
    </div>

    <video
        id="video"
        controls
        playsinline
    ></video>

</div>

<script>

const WORKER_URL =
    "https://watch-party-proxy.dahmani-jibril.workers.dev";

let hls = null;

const video =
    document.getElementById("video");

const input =
    document.getElementById("url");

const status =
    document.getElementById("status");


function setStatus(text) {
    status.textContent = text;
}


function playVideo() {

    const source =
        input.value.trim();

    if (!source) {

        setStatus(
            "❌ Colle une URL M3U8."
        );

        return;
    }

    if (!source.startsWith("https://")) {

        setStatus(
            "❌ L'URL doit commencer par https://"
        );

        return;
    }


    // Détruire l'ancien lecteur
    if (hls) {

        hls.destroy();

        hls = null;
    }


    video.pause();

    video.removeAttribute("src");

    video.load();


    // URL du Worker
    const proxyUrl =
        WORKER_URL +
        "/?url=" +
        encodeURIComponent(source);


    setStatus(
        "⏳ Chargement du flux..."
    );


    // Firefox / Chrome / Edge
    if (Hls.isSupported()) {

        hls = new Hls({
            enableWorker: true,
            lowLatencyMode: false,
            backBufferLength: 90
        });


        hls.loadSource(proxyUrl);

        hls.attachMedia(video);


        hls.on(
            Hls.Events.MANIFEST_PARSED,
            function () {

                setStatus(
                    "▶ Vidéo prête"
                );

                video.play().catch(() => {});

            }
        );


        hls.on(
            Hls.Events.ERROR,
            function(event, data) {

                console.error(
                    "HLS ERROR:",
                    data
                );

                if (data.fatal) {

                    setStatus(
                        "❌ Erreur : " +
                        data.details
                    );

                }

            }
        );


    // Safari / iPhone / iPad
    } else if (
        video.canPlayType(
            "application/vnd.apple.mpegurl"
        )
    ) {

        video.src = proxyUrl;

        video.addEventListener(
            "loadedmetadata",
            function() {

                setStatus(
                    "▶ Vidéo prête"
                );

                video.play().catch(() => {});

            },
            { once: true }
        );


    } else {

        setStatus(
            "❌ HLS n'est pas supporté par ce navigateur."
        );

    }
}


// Touche Entrée
input.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {
            playVideo();
        }

    }
);

</script>

</body>
</html>
